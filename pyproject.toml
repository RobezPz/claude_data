[project]
name = "claude-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rob P", email = "robepintally@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bleach>=6.4.0",
    "markdown>=3.11.2",
    "opentelemetry-distro>=0.66b1",
    "opentelemetry-exporter-otlp>=1.45.1",
    "playwright>=1.63.0",
]

[project.scripts]
claude-data = "claude_data:main"

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
